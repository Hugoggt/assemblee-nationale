name: Hémicycle

# Reconstruit les données chaque matin, génère une page par loi, député, vote…
# puis publie le site sur GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Avec un nom de domaine à soi : SITE_URL=https://mon-domaine.fr et SITE_BASE=/
  SITE_URL: https://hemicycles.fr
  SITE_BASE: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les données ouvertes
        run: python pipeline/fetch.py --force
      - name: Construire les données du site
        run: python -X utf8 pipeline/build.py
      - name: Budget de l'État (data.economie.gouv.fr, INSEE)
        run: python -X utf8 pipeline/budget.py
        continue-on-error: true
      - name: Générer les pages et le plan du site
        run: python -X utf8 pipeline/prerender.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
